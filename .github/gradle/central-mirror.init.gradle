// Gradle counterpart of the Central mirror in .github/maven/settings.xml.
// Gradle never reads Maven settings files, so mavenCentral() in a build script
// still goes to repo.maven.apache.org, which answers the IP ranges of
// GitHub-hosted runners with 429. This script points every repository on that
// host at Google's mirror of Central instead, in the settings (plugin
// management and dependency resolution management), in the build scripts'
// classpath repositories and in the projects' own.
//
// The Gradle steps in validation.yml pass it with --init-script. The
// gradle-plugin's functionalTest task hands the init scripts of the outer
// build on to the nested TestKit builds, which run under a Gradle user home of
// their own and so would not see a script in ~/.gradle/init.d.

def centralHost = 'repo.maven.apache.org'
def centralMirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

def redirectCentral = { RepositoryHandler repositories ->
    repositories.withType(MavenArtifactRepository).configureEach { repository ->
        if (repository.url?.host == centralHost) {
            repository.url = centralMirror
        }
    }
}

beforeSettings { settings ->
    redirectCentral(settings.pluginManagement.repositories)
    redirectCentral(settings.buildscript.repositories)
    redirectCentral(settings.dependencyResolutionManagement.repositories)
}

allprojects {
    redirectCentral(buildscript.repositories)
    redirectCentral(repositories)
}
