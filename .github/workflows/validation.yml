name: Validation

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main, '25.2', '25.1', '24.10', '24.9', '2.5', '1.5']
    paths-ignore:
      - 'hilla-logo.svg'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/*'
      - 'packages/**/README.md'
      - 'scripts/generator/templates/**/*.md'
  # No `branches` filter here: it matches the pull request's base branch, so
  # listing only the long-lived branches skipped every stacked pull request -
  # one based on the branch below it in the stack instead of on main. Those
  # branches are not in the `push` list either, so their code got no
  # validation at all until the stack was retargeted. Release branches are
  # unaffected: a pull request runs the workflow file from its own merge
  # commit, so a pull request against e.g. 24.9 uses that branch version of
  # this file.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'hilla-logo.svg'
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/*'
      - 'packages/**/README.md'
      - 'scripts/generator/templates/**/*.md'
  # Called by validation-label.yml for the label that asks for jobs the other
  # events leave out - `run-windows-tests` - so that adding it starts those
  # jobs on a pull request that is already open, without a commit to push.
  # The `labeled` event is there rather than here because it fires for every
  # label: a run of this workflow started by any other label skipped all of
  # its jobs, which listed skipped copies of the real checks on the pull
  # request. A called workflow sees the event of its caller, so a run started
  # by the label runs only what the label asks for: what that is, the init
  # job below works out once and the jobs after it read from its outputs.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A run a label started gets a group of its own, one per label, so that it
  # neither cancels the runs of the pull request itself nor is cancelled by
  # them.
  group: >-
    ${{ github.event.action == 'labeled'
    && format('{0}-{1}', github.head_ref, github.event.label.name)
    || github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  _HEAD_REF: ${{ github.head_ref }}
  _REF_NAME: ${{ github.ref_name }}
  _HEAD_SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  init:
    name: Build Java and TypeScript for other tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NX_SKIP_NX_CACHE: true
    # What a run started by a label asks for, read once here and by the jobs
    # below as `needs.init.outputs`, rather than repeated in every condition.
    # A run any other event started asks for everything. The conditions read
    # these as "not false", so that a job runs rather than skips if it ever
    # sees no answer at all - re-running the failed jobs of a run does not
    # run this one again.
    outputs:
      everything: ${{ github.event.action != 'labeled' }}
      windows_tests: >-
        ${{ github.event.action != 'labeled'
        || github.event.label.name == 'run-windows-tests' }}

    steps:
      - name: Check secrets
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          [ -z "${{secrets.TB_LICENSE}}" ] \
            && echo "🚫 **TB_LICENSE** is not defined, check that **${{github.repository}}** repo has a valid secret" \
            | tee -a $GITHUB_STEP_SUMMARY && exit 1 || exit 0
      - name: Checkout Project Code
        uses: actions/checkout@v5
        with:
          ref: ${{env._HEAD_SHA}}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build TypeScript
        run: npm run build
      - name: Build Java
        run: mvn install -B -ntp -DskipTests -Dmaven.test.skip=true -Dmaven.javadoc.skip=true
      - name: Save Workspace
        run: |
          tar cf workspace.tar -C ~/ $( \
            mvn -q -DskipTests \
              -Dexec.executable='echo' \
              -Dexec.args='${project.groupId}:${project.artifactId}' \
              exec:exec \
            | perl -pe 's/\.(?=.*:)/\//g' \
            | sed -e 's/:/\//' \
            | sed -e 's/^/.m2\/repository\//' \
          )
          find packages/java -type d -name target -print0 | xargs -0 tar rf workspace.tar
          find packages/java/tests -path */src/main/resources/vaadin-core-versions.json -print0 | xargs -0 tar rf workspace.tar
          find scripts/prepare/results -print0 | xargs -0 tar rf workspace.tar
          tar rf workspace.tar $(find packages/ts -name node_modules -prune -o -print | git check-ignore --stdin)
      - uses: actions/upload-artifact@v6
        with:
          name: saved-workspace
          path: workspace.tar
          retention-days: 1
          if-no-files-found: error

  check-style:
    needs: init
    name: Check style
    if: ${{ needs.init.outputs.everything != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v5
        with:
          ref: ${{env._HEAD_SHA}}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: saved-workspace
      - name: Restore Workspace
        run: |
          set -x
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Validate Java Format
        run: mvn -B formatter:validate
      - name: Lint TypeScript
        run: npm run check

  test-java:
    needs: init
    name: Test Java
    if: ${{ needs.init.outputs.everything != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v5
        with:
          ref: ${{env._HEAD_SHA}}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: saved-workspace
      - name: Restore Workspace
        run: |
          set -x
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Test
        run: mvn -B -am -P\!it-modules verify -pl '!:hilla-gradle-plugin'
      - name: Collect Coverage
        run: |
          COVFILES=$(find packages/java -wholename '*/target/site/jacoco/jacoco.xml' | tr '\n' ',' | sed '$s/,$//')
          if [ -z "$COVFILES" ]; then
            echo "::error::No JaCoCo report found under packages/java, so there is nothing to upload."
            exit 1
          fi
          echo "COVFILES=$COVFILES" >> $GITHUB_ENV
      - name: Send Coverage to Codecov
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVFILES }}
          flags: unittests
          fail_ci_if_error: true
          root_dir: ${{ github.workspace }}

  test-typescript:
    needs: init
    name: Test TypeScript
    if: ${{ needs.init.outputs.everything != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - name: Checkout Project Code
        uses: actions/checkout@v5
        with:
          ref: ${{env._HEAD_SHA}}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: saved-workspace
      - name: Restore Workspace
        run: |
          set -x
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Test
        run: npm run test:coverage
        env:
          CI: true
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Collect Coverage
        run: |
          COVFILES=$(find packages/ts -wholename '*/.coverage/lcov.info' | tr '\n' ',' | sed '$s/,$//')
          echo "COVFILES=$COVFILES" >> $GITHUB_ENV
      - name: Send Coverage to Codecov
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVFILES }}
          flags: unittests
          fail_ci_if_error: true
          root_dir: ${{ github.workspace }}

  test-it:
    needs:
      - init
    if: >-
      ${{ !github.event.pull_request.head.repo.fork
      && needs.init.outputs.everything != 'false' }}
    name: ITs
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            it-modules: group-1
          - os: ubuntu-latest
            it-modules: group-2
          - os: ubuntu-latest
            it-modules: some
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v5
        with:
          ref: ${{env._HEAD_SHA}}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: saved-workspace
      - name: Restore Workspace
        run: |
          set -x
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Set TB License
        run: |
          TB_LICENSE=${{secrets.TB_LICENSE}}
          mkdir -p ~/.vaadin/
          echo '{"username":"'`echo $TB_LICENSE | cut -d / -f1`'","proKey":"'`echo $TB_LICENSE | cut -d / -f2`'"}' > ~/.vaadin/proKey
      # Unlike on main, a failing IT gets two more chances here: a maintenance
      # branch only takes fixes, so flakiness it surfaces is not worked on.
      - name: Verify
        run: |
          (
            cd packages/java/tests && \
            mvn -B -am -ntp -fae \
              -Dfailsafe.forkCount=4 \
              -Dcom.vaadin.testbench.Parameters.testsInParallel=5 \
              -Dfailsafe.rerunFailingTestsCount=2 \
              -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -P\!it-modules \
              -Pit-modules-${{ matrix.it-modules }} \
              -Pproduction \
              verify
          )
      - uses: actions/upload-artifact@v6
        if: ${{ failure() || success() }}
        with:
          name: saved-outputs-it-${{ matrix.os }}-${{ matrix.it-modules }}
          path: |
            packages/java/tests/**/target/*-reports/*
            packages/java/tests/**/error-screenshots/*.png

  test-gradle:
    needs:
      - init
    if: >-
      ${{ !github.event.pull_request.head.repo.fork
      && needs.init.outputs.windows_tests != 'false' }}
    name: Gradle tests
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # The Windows legs take ~10 and ~6 minutes while every other validation
      # job is done in 4, so they alone decide how long a PR waits. They guard
      # path-separator and file-locking behaviour, which rarely changes, so run
      # them on pushes to main and the release branches (i.e. on every merge)
      # and on workflow_dispatch, but not on pull requests. To get them on a
      # PR, add the `run-windows-tests` label: that starts a run of the
      # Windows legs alone, since the Ubuntu ones have already run with the
      # rest of the validation. Re-running an existing run does not pick the
      # label up, because it replays the original event payload.
      matrix:
        os: >-
          ${{ fromJSON(github.event.action == 'labeled'
          && '["windows-latest"]'
          || (github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'run-windows-tests')
          && '["ubuntu-latest"]')
          || '["ubuntu-latest", "windows-latest"]') }}
        # The plugin leg (the gradle-plugin functional tests) and the IT leg
        # (kotlin-gradle-test) are independent once the plugin is in the local
        # Maven repository, and running them one after the other made this the
        # longest validation job. Both legs publish the plugin first, which
        # costs half a minute each, and the tests then run in parallel.
        task: [plugin, its]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v5
        with:
          ref: ${{env._HEAD_SHA}}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: saved-workspace
      - name: Restore Workspace
        run: |
          set -x
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      # The functional tests run the build under test with the Gradle version
      # pinned in TestUtils.kt, which TestKit downloads into the Gradle user
      # home. setup-gradle only caches wrapper zips, and TestKit deletes the
      # zip once it has unpacked it, so without this the distribution is
      # downloaded again on every run. Keep the version in sync with
      # TestProject.gradleVersion in TestUtils.kt.
      - name: Cache the Gradle distribution used by TestKit
        if: ${{ matrix.task == 'plugin' }}
        uses: actions/cache@v5
        with:
          path: ${{ env.GRADLE_USER_HOME || '~/.gradle' }}/wrapper/dists/gradle-8.7-bin
          key: ${{ runner.os }}-testkit-gradle-dist-${{ hashFiles('packages/java/gradle-plugin/src/functionalTest/kotlin/com/vaadin/hilla/gradle/plugin/TestUtils.kt') }}
          restore-keys: |
            ${{ runner.os }}-testkit-gradle-dist-
      - name: Set TB License
        run: |
          TB_LICENSE=${{secrets.TB_LICENSE}}
          mkdir -p ~/.vaadin/
          echo '{"username":"'`echo $TB_LICENSE | cut -d / -f1`'","proKey":"'`echo $TB_LICENSE | cut -d / -f2`'"}' > ~/.vaadin/proKey
      - name: publish plugin to Maven Local
        run: ./packages/java/gradle-plugin/gradlew --info -p packages/java/gradle-plugin build publishToMavenLocal -x functionalTest
      - name: Test gradle-plugin's functional tests
        if: ${{ matrix.task == 'plugin' }}
        run: ./packages/java/gradle-plugin/gradlew --info -p packages/java/gradle-plugin functionalTest
      - name: Gradle ITs
        if: ${{ matrix.task == 'its' }}
        run: ./packages/java/tests/gradle/kotlin-gradle-test/gradlew --info --stacktrace -p packages/java/tests/gradle/kotlin-gradle-test clean integrationTest
      - uses: actions/upload-artifact@v6
        if: ${{ failure() || success() }}
        with:
          name: saved-outputs-gradle-${{ matrix.os }}-${{ matrix.task }}
          path: |
            packages/java/tests/**/target/*-reports/*
            packages/java/tests/**/error-screenshots/*.png
            packages/java/gradle-plugin/build/test-results/*
            packages/java/gradle-plugin/build/reports/*

  test-react-18:
    needs:
      - init
    if: >-
      ${{ !github.event.pull_request.head.repo.fork
      && needs.init.outputs.everything != 'false' }}
    name: React 18 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - name: Checkout Project Code
        uses: actions/checkout@v5
        with:
          ref: ${{env._HEAD_SHA}}
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: saved-workspace
      - name: Restore Workspace
        run: |
          set -x
          tar xf workspace.tar
          tar cf - .m2 | (cd ~ && tar xf -)
      - name: Install React 18
        run: npm run build:react-18
      - name: Test
        run: npm run test:react
        env:
          CI: true
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Set TB License
        run: |
          TB_LICENSE=${{secrets.TB_LICENSE}}
          mkdir -p ~/.vaadin/
          echo '{"username":"'`echo $TB_LICENSE | cut -d / -f1`'","proKey":"'`echo $TB_LICENSE | cut -d / -f2`'"}' > ~/.vaadin/proKey
      # Unlike on main, a failing IT gets two more chances here: a maintenance
      # branch only takes fixes, so flakiness it surfaces is not worked on.
      - name: Verify
        run: |
          (
            cd packages/java/tests && \
            mvn -B -am -ntp -fae \
              -Dfailsafe.forkCount=4 \
              -Dcom.vaadin.testbench.Parameters.testsInParallel=5 \
              -Dfailsafe.rerunFailingTestsCount=2 \
              -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -P\!it-modules \
              -Preact-18 \
              -Pproduction \
              verify
          )
      - uses: actions/upload-artifact@v6
        if: ${{ failure() || success() }}
        with:
          name: saved-outputs-react-18
          path: |
            packages/java/tests/**/target/*-reports/*
            packages/java/tests/**/error-screenshots/*.png

  test-all:
    # A static name, as this is the required check of a pull request. A run a
    # label started is called from validation-label.yml, so its summary is
    # listed as `Requested by label / Tests Summary` and does not replace the
    # one of the run that validated the commit.
    name: Tests Summary
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - init
      - check-style
      - test-java
      - test-typescript
      - test-it
      - test-gradle
      - test-react-18
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v6
        with:
          name: saved-outputs
          pattern: saved-outputs-*
      # A skipped job is not a failure: which jobs run depends on the event,
      # on the labels of the pull request and on whether it comes from a
      # fork. A job that failed takes the rest of the run with it, and so
      # does `init`, whose failure leaves everything after it skipped.
      - name: Fail if test jobs did not succeed
        if: >-
          ${{ contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled') }}
        run: exit 1
