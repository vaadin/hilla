version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Stay on ClassGraph 4.x. ClassGraph 6 requires JDK 25 or newer, while
      # Hilla still supports JDK 21, and moving to 5.x is a deliberate decision.
      - dependency-name: "io.github.classgraph:classgraph"
        versions: [">= 5"]
