# Configuration for SonarQube Cloud automatic analysis, which is what analyzes
# this repository: the check is reported by the SonarQube Cloud GitHub app, and
# no CI job runs a scanner. Automatic analysis reads this file, not
# `sonar-project.properties`. Note that `sonar.skip` in
# packages/java/tests/pom.xml is leftover configuration from the time the
# analysis was run by the Maven scanner.

# Analyze the tests as test code instead of as main code. Automatic analysis
# classifies every file as a source file unless told otherwise, and the
# copy-paste detector only runs on main files, so the tests are currently
# reported as duplication: of the 20446 duplicated lines of the project, 19498
# are in TypeScript test files, which is what makes the ratio of the project
# 32.8% and fails the quality gate for changes that only touch tests. Tests
# are still analyzed, with the rules that apply to test code.
#
# The patterns cover the `test` folders of the TypeScript packages, the `tests`
# folder with the integration test applications, the functional tests of the
# Gradle plugin, and the spec files that live outside a test folder. They are
# excluded from the sources as well, because a file cannot be both main and
# test code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test/**,**/tests/**,**/src/functionalTest/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/test/**,**/tests/**,**/src/functionalTest/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# The snapshot folders under the test resources contain generated TypeScript:
# the expected output of the endpoint code generator, written by the tests
# themselves with `-Dhilla.test.updateSnapshots`. The `.snap.ts` fixtures of
# the TypeScript generator tests are the same kind of artifact. Being
# generated, they repeat each other by construction, since the same entity or
# mapped type is generated for more than one test, and they cannot be
# deduplicated without weakening the tests. They are fixtures rather than
# code, so they are not analyzed even as test code.
sonar.test.exclusions=**/src/test/resources/**/snapshots/**,**/test/**/*.snap.ts
