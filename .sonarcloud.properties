# Configuration for SonarQube Cloud automatic analysis, which is what analyzes
# this repository: the check is reported by the SonarQube Cloud GitHub app, and
# no CI job runs a scanner. Automatic analysis reads this file, not
# `sonar-project.properties`. Note that `sonar.skip` in
# packages/java/tests/pom.xml is leftover configuration from the time the
# analysis was run by the Maven scanner.

# The snapshot folders under the test resources contain generated TypeScript:
# the expected output of the endpoint code generator, written by the tests
# themselves with `-Dhilla.test.updateSnapshots`. The `.snap.ts` fixtures of
# the TypeScript generator tests are the same kind of artifact. Being
# generated, they repeat each other by construction, since the same entity or
# mapped type is generated for more than one test, and they cannot be
# deduplicated without weakening the tests. They are fixtures rather than
# code, so they are not analyzed.
sonar.exclusions=**/src/test/resources/**/snapshots/**,**/test/**/*.snap.ts
sonar.test.exclusions=**/src/test/resources/**/snapshots/**,**/test/**/*.snap.ts
