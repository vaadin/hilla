# SonarCloud runs automatic analysis for this repository, which reads its
# configuration from this file. Note that `sonar.skip` in
# packages/java/tests/pom.xml is leftover configuration from the time the
# analysis was run by the Maven scanner, which does not read this file.
#
# The snapshot files under the test resources contain generated TypeScript: the
# expected output of the endpoint code generator, written by the tests
# themselves with `-Dhilla.test.updateSnapshots`. The same is true for the
# `.snap.ts` fixtures of the TypeScript generator tests. Repetition is inherent
# to them, since the same entity or mapped type is generated for more than one
# test, and it cannot be refactored away without weakening the tests. They are
# fixtures rather than code, so they are not analyzed for duplication.
sonar.cpd.exclusions=**/src/test/resources/**/snapshots/**,**/test/**/*.snap.ts
