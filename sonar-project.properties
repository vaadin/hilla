# The `snapshots` folders under test resources contain generated TypeScript:
# the expected output of the endpoint code generator, written by the tests
# themselves with `-Dhilla.test.updateSnapshots`. Repetition is inherent to
# them, since the same entity or mapped type is generated for more than one
# test, and it cannot be refactored away without weakening the tests. They are
# fixtures rather than code, so they are not analyzed for duplication.
sonar.cpd.exclusions=**/src/test/resources/**/snapshots/**
